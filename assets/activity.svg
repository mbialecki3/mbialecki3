  </g>

  <line x1="40" y1="360" x2="860" y2="360" stroke="#24283b"/>
  <g class="mono">
    <text x="60" y="388" class="muted">contributions</text><text x="60" y="408" class="value">236</text>
    <text x="270" y="388" class="muted">active days</text><text x="270" y="408" class="value">60</text>
    <text x="480" y="388" class="muted">current streak</text><text x="480" y="408" class="value">1 day</text>
    <text x="690" y="388" class="muted">longest streak</text><text x="690" y="408" class="value">7 days</text>
  </g>
