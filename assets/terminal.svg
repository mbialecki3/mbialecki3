<svg
    width="900"
    height="330"
    viewBox="0 0 900 330"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

    <!-- Terminal -->
    <rect
        x="1"
        y="1"
        width="898"
        height="328"
        rx="10"
        fill="#0d1117"
        stroke="#30363d"
        stroke-width="2"/>

    <!-- Title bar -->
    <circle cx="24" cy="24" r="6" fill="#484f58"/>
    <circle cx="44" cy="24" r="6" fill="#484f58"/>
    <circle cx="64" cy="24" r="6" fill="#484f58"/>

    <text
        x="450"
        y="29"
        text-anchor="middle"
        fill="#8b949e"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="13">
        mitchell@github
    </text>

    <line
        x1="1"
        y1="46"
        x2="899"
        y2="46"
        stroke="#21262d"
        stroke-width="1"/>

    <!-- Reveal clips -->

    <clipPath id="line1">
        <rect x="42" y="62" width="0" height="25">
            <animate
                attributeName="width"
                from="0"
                to="340"
                dur="1.1s"
                begin="0.4s"
                fill="freeze"/>
        </rect>
    </clipPath>

    <clipPath id="line2">
        <rect x="42" y="91" width="0" height="25">
            <animate
                attributeName="width"
                from="0"
                to="250"
                dur="0.8s"
                begin="1.7s"
                fill="freeze"/>
        </rect>
    </clipPath>

    <clipPath id="line3">
        <rect x="42" y="120" width="0" height="25">
            <animate
                attributeName="width"
                from="0"
                to="620"
                dur="1.6s"
                begin="2.6s"
                fill="freeze"/>
        </rect>
    </clipPath>

    <clipPath id="line4">
        <rect x="42" y="164" width="0" height="25">
            <animate
                attributeName="width"
                from="0"
                to="330"
                dur="1s"
                begin="4.5s"
                fill="freeze"/>
        </rect>
    </clipPath>

    <clipPath id="line5">
        <rect x="42" y="193" width="0" height="25">
            <animate
                attributeName="width"
                from="0"
                to="500"
                dur="1.3s"
                begin="5.7s"
                fill="freeze"/>
        </rect>
    </clipPath>

    <clipPath id="line6">
        <rect x="42" y="237" width="0" height="25">
            <animate
                attributeName="width"
                from="0"
                to="350"
                dur="1s"
                begin="7.3s"
                fill="freeze"/>
        </rect>
    </clipPath>

    <clipPath id="line7">
        <rect x="42" y="266" width="0" height="25">
            <animate
                attributeName="width"
                from="0"
                to="520"
                dur="1.3s"
                begin="8.5s"
                fill="freeze"/>
        </rect>
    </clipPath>

    <!-- Terminal content -->

    <text
        x="42"
        y="80"
        clip-path="url(#line1)"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16">
        <tspan fill="#7ee787">mitchell@github:~$</tspan>
        <tspan fill="#c9d1d9"> whoami</tspan>
    </text>

    <text
        x="42"
        y="109"
        clip-path="url(#line2)"
        fill="#58a6ff"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16">
        Mitchell Bialecki
    </text>

    <text
        x="42"
        y="138"
        clip-path="url(#line3)"
        fill="#8b949e"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16">
        Computer Systems Engineering @ Arizona State University
    </text>

    <text
        x="42"
        y="182"
        clip-path="url(#line4)"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16">
        <tspan fill="#7ee787">mitchell@github:~$</tspan>
        <tspan fill="#c9d1d9"> focus</tspan>
    </text>

    <text
        x="42"
        y="211"
        clip-path="url(#line5)"
        fill="#c9d1d9"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16">
        FPGA / Embedded / Systems / Security
    </text>

    <text
        x="42"
        y="255"
        clip-path="url(#line6)"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16">
        <tspan fill="#7ee787">mitchell@github:~$</tspan>
        <tspan fill="#c9d1d9"> status</tspan>
    </text>

    <text
        x="42"
        y="284"
        clip-path="url(#line7)"
        fill="#c9d1d9"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16">
        building systems close to the metal
    </text>

    <!-- Cursor -->
    <rect
        x="394"
        y="269"
        width="9"
        height="18"
        rx="1"
        fill="#7ee787"
        opacity="0">
        <animate
            attributeName="opacity"
            values="0;0;1;0;1;0;1"
            keyTimes="0;0.72;0.76;0.82;0.88;0.94;1"
            dur="12s"
            repeatCount="indefinite"/>
    </rect>

</svg>
