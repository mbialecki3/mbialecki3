name: Update contribution heatmap

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/render_heatmap.py

      - name: Commit updated heatmap
        run: |
          if [ -z "$(git status --porcelain -- assets/activity.svg)" ]; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity.svg
          git commit -m "chore: refresh activity chart"
          git push
